<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Circular Route Planner</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Font Awesome (local) -->
  <link rel="stylesheet" href="css/font-awesome.min.css">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      overflow: visible;
    }

    html, body {
      height: 100%;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background: #111827;
      color: #e5e7eb;
      overflow: hidden;
    }

    /* ── Layout ── */
    .app-shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .top-bar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 24px;
      background: #1f2937;
      border-bottom: 1px solid #374151;
    }

    .top-bar-back {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #9ca3af;
      text-decoration: none;
      font-size: 13px;
      transition: color 0.15s;
    }
    .top-bar-back:hover { color: #f9fafb; }

    .top-bar-divider {
      width: 1px;
      height: 20px;
      background: #374151;
    }

    .top-bar-title {
      font-size: 18px;
      font-weight: 700;
      color: #f9fafb;
      letter-spacing: -0.3px;
    }

    .top-bar-subtitle {
      font-size: 13px;
      color: #6b7280;
      margin-left: auto;
    }

    .main-body {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 300px;
      flex-shrink: 0;
      background: #1f2937;
      border-right: 1px solid #374151;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 20px 16px;
      gap: 16px;
    }

    .card {
      background: #111827;
      border: 1px solid #374151;
      border-radius: 10px;
      padding: 14px;
    }

    .card-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #6b7280;
      margin-bottom: 10px;
    }

    /* Location */
    .btn-location {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 14px;
      background: #374151;
      border: 1px solid #4b5563;
      border-radius: 8px;
      color: #d1d5db;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .btn-location:hover { background: #4b5563; color: #f9fafb; }
    .btn-location:disabled { opacity: 0.5; cursor: not-allowed; }

    .map-hint {
      text-align: center;
      font-size: 12px;
      color: #6b7280;
      margin-top: 8px;
    }

    /* Activity */
    .activity-grid {
      display: flex;
      gap: 6px;
    }

    .activity-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      padding: 10px 6px;
      background: #1f2937;
      border: 2px solid #374151;
      border-radius: 8px;
      color: #6b7280;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .activity-btn i { font-size: 18px; }
    .activity-btn:hover { border-color: #6b7280; color: #d1d5db; }
    .activity-btn.active {
      border-color: #3b82f6;
      color: #93c5fd;
      background: rgba(59,130,246,0.1);
    }
    .activity-btn[data-activity="running"].active {
      border-color: #f59e0b;
      color: #fcd34d;
      background: rgba(245,158,11,0.1);
    }
    .activity-btn[data-activity="cycling"].active {
      border-color: #10b981;
      color: #6ee7b7;
      background: rgba(16,185,129,0.1);
    }

    /* Distance */
    .distance-display {
      text-align: center;
      margin-bottom: 10px;
    }
    .distance-display .value {
      font-size: 38px;
      font-weight: 700;
      color: #f9fafb;
      line-height: 1;
    }
    .distance-display .unit {
      font-size: 16px;
      color: #6b7280;
      margin-left: 4px;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      background: #374151;
      border-radius: 2px;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      background: #3b82f6;
      border-radius: 50%;
      cursor: pointer;
    }
    input[type="range"]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      background: #3b82f6;
      border: none;
      border-radius: 50%;
      cursor: pointer;
    }

    .range-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #4b5563;
      margin-top: 5px;
    }

    /* Generate button */
    .btn-generate {
      width: 100%;
      padding: 14px;
      background: #2563eb;
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.3px;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-generate:hover { background: #1d4ed8; transform: translateY(-1px); }
    .btn-generate:active { transform: translateY(0); }
    .btn-generate:disabled { background: #374151; color: #6b7280; cursor: not-allowed; transform: none; }

    /* Route stats */
    .stats-row {
      display: flex;
      gap: 8px;
    }

    .stat-box {
      flex: 1;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }
    .stat-box i { font-size: 16px; color: #3b82f6; display: block; margin-bottom: 4px; }
    .stat-box .stat-value { font-size: 16px; font-weight: 700; color: #f9fafb; }
    .stat-box .stat-label { font-size: 10px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }

    .btn-reshuffle {
      width: 100%;
      margin-top: 8px;
      padding: 9px 14px;
      background: transparent;
      border: 1px solid #374151;
      border-radius: 8px;
      color: #6b7280;
      font-size: 13px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .btn-reshuffle:hover { border-color: #6b7280; color: #d1d5db; }

    /* Error */
    .error-banner {
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.35);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
      color: #fca5a5;
      line-height: 1.4;
    }

    .hidden { display: none !important; }

    /* ── Map ── */
    .map-wrapper {
      flex: 1;
      position: relative;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .loading-veil {
      position: absolute;
      inset: 0;
      background: rgba(17,24,39,0.65);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 500;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(59,130,246,0.3);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    .loading-label { font-size: 14px; color: #9ca3af; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Start marker */
    .start-pin {
      width: 14px;
      height: 14px;
      background: #f9fafb;
      border: 3px solid #2563eb;
      border-radius: 50%;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.25);
    }

    /* Responsive */
    @media (max-width: 680px) {
      .main-body { flex-direction: column; }
      .sidebar {
        width: 100%;
        max-height: 55vh;
        border-right: none;
        border-bottom: 1px solid #374151;
      }
      .map-wrapper { min-height: 45vh; }
      .top-bar-subtitle { display: none; }
    }
  </style>
</head>
<body>
<div class="app-shell">

  <!-- Top bar -->
  <header class="top-bar">
    <a href="index.html" class="top-bar-back">
      <i class="fa fa-arrow-left"></i> Portfolio
    </a>
    <div class="top-bar-divider"></div>
    <span class="top-bar-title">
      <i class="fa fa-refresh" style="color:#3b82f6;margin-right:6px;"></i>Circular Route Planner
    </span>
    <span class="top-bar-subtitle">Walking &middot; Running &middot; Cycling</span>
  </header>

  <div class="main-body">

    <!-- ── Sidebar controls ── -->
    <aside class="sidebar">

      <!-- Start point -->
      <div class="card">
        <div class="card-label"><i class="fa fa-map-marker"></i> Start Point</div>
        <button class="btn-location" id="btn-location">
          <i class="fa fa-crosshairs"></i> Use My Location
        </button>
        <p class="map-hint">or click anywhere on the map</p>
      </div>

      <!-- Activity -->
      <div class="card">
        <div class="card-label"><i class="fa fa-heartbeat"></i> Activity</div>
        <div class="activity-grid">
          <button class="activity-btn active" data-activity="walking">
            <i class="fa fa-male"></i>Walking
          </button>
          <button class="activity-btn" data-activity="running">
            <i class="fa fa-male"></i>Running
          </button>
          <button class="activity-btn" data-activity="cycling">
            <i class="fa fa-bicycle"></i>Cycling
          </button>
        </div>
      </div>

      <!-- Distance -->
      <div class="card">
        <div class="card-label"><i class="fa fa-road"></i> Target Distance</div>
        <div class="distance-display">
          <span class="value" id="dist-val">5</span><span class="unit">km</span>
        </div>
        <input type="range" id="dist-slider" min="2" max="20" value="5" step="0.5">
        <div class="range-labels"><span>2 km</span><span>20 km</span></div>
      </div>

      <!-- Generate -->
      <button class="btn-generate" id="btn-generate">
        <i class="fa fa-refresh"></i> Generate Route
      </button>

      <!-- Route stats (hidden until route generated) -->
      <div class="card hidden" id="stats-card">
        <div class="card-label"><i class="fa fa-bar-chart"></i> Route Summary</div>
        <div class="stats-row">
          <div class="stat-box">
            <i class="fa fa-road"></i>
            <div class="stat-value" id="stat-dist">—</div>
            <div class="stat-label">Distance</div>
          </div>
          <div class="stat-box">
            <i class="fa fa-clock-o"></i>
            <div class="stat-value" id="stat-time">—</div>
            <div class="stat-label">Est. Time</div>
          </div>
          <div class="stat-box">
            <i class="fa fa-tachometer"></i>
            <div class="stat-value" id="stat-pace">—</div>
            <div class="stat-label">Avg Pace</div>
          </div>
        </div>
        <button class="btn-reshuffle" id="btn-reshuffle">
          <i class="fa fa-random"></i> Try a Different Direction
        </button>
      </div>

      <!-- Error -->
      <div class="error-banner hidden" id="error-msg"></div>

    </aside>

    <!-- ── Map ── -->
    <div class="map-wrapper">
      <div id="map"></div>
      <div class="loading-veil hidden" id="loading">
        <div class="spinner"></div>
        <span class="loading-label">Plotting your route…</span>
      </div>
    </div>

  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ================================================================
   Constants & State
   ================================================================ */
const VALHALLA = 'https://valhalla1.openstreetmap.de/route';
const R = 6371000; // Earth radius metres

const COSTING = { walking: 'pedestrian', running: 'pedestrian', cycling: 'bicycle' };
const SPEED   = { walking: 5, running: 10, cycling: 20 }; // km/h
const COLOR   = { walking: '#3b82f6', running: '#f59e0b', cycling: '#10b981' };
const PACE_UNIT = { walking: 'min/km', running: 'min/km', cycling: 'km/h' };

let startPoint   = null;
let activity     = 'walking';
let routeLayer   = null;
let startMarker  = null;
let bearingBase  = Math.random() * 360;

/* ================================================================
   Map
   ================================================================ */
const map = L.map('map', { zoomControl: true }).setView([51.505, -0.09], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 19
}).addTo(map);

map.on('click', e => placeStart(e.latlng.lat, e.latlng.lng));

/* ================================================================
   UI helpers
   ================================================================ */
function placeStart(lat, lng) {
  startPoint = { lat, lng };
  if (startMarker) map.removeLayer(startMarker);
  startMarker = L.marker([lat, lng], {
    icon: L.divIcon({ className: '', html: '<div class="start-pin"></div>', iconSize: [14,14], iconAnchor: [7,7] })
  }).addTo(map).bindPopup('<strong>Start / Finish</strong>');
  hideError();
}

function setLoading(on) {
  document.getElementById('loading').classList.toggle('hidden', !on);
  document.getElementById('btn-generate').disabled = on;
}

function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg;
  el.classList.remove('hidden');
}

function hideError() {
  document.getElementById('error-msg').classList.add('hidden');
}

function showStats(distM, act) {
  const distKm = distM / 1000;
  const mins   = (distKm / SPEED[act]) * 60;

  document.getElementById('stat-dist').textContent = distKm.toFixed(2) + ' km';
  document.getElementById('stat-time').textContent =
    mins >= 60 ? `${Math.floor(mins/60)}h ${Math.round(mins%60)}m` : `${Math.round(mins)} min`;

  if (act === 'cycling') {
    document.getElementById('stat-pace').textContent = SPEED[act] + ' km/h';
  } else {
    const minsPerKm = 60 / SPEED[act];
    document.getElementById('stat-pace').textContent =
      `${Math.floor(minsPerKm)}:${String(Math.round((minsPerKm%1)*60)).padStart(2,'0')} /km`;
  }

  document.getElementById('stats-card').classList.remove('hidden');
}

/* ================================================================
   Geo math
   ================================================================ */
function destPoint(lat, lng, bearingDeg, distM) {
  const δ  = distM / R;
  const θ  = bearingDeg * Math.PI / 180;
  const φ1 = lat * Math.PI / 180;
  const λ1 = lng * Math.PI / 180;
  const φ2 = Math.asin(Math.sin(φ1)*Math.cos(δ) + Math.cos(φ1)*Math.sin(δ)*Math.cos(θ));
  const λ2 = λ1 + Math.atan2(Math.sin(θ)*Math.sin(δ)*Math.cos(φ1), Math.cos(δ)-Math.sin(φ1)*Math.sin(φ2));
  return [φ2*180/Math.PI, ((λ2*180/Math.PI)+540)%360-180];
}

function buildWaypoints(lat, lng, targetM, n, bOffset) {
  // radius: true road distance ≈ 1.35× straight-line, so shrink radius accordingly
  const radius = (targetM / (2 * Math.PI)) * 0.74;
  const pts = [];
  for (let i = 0; i < n; i++) {
    pts.push(destPoint(lat, lng, bOffset + (360/n)*i, radius));
  }
  return pts;
}

/* ================================================================
   Valhalla routing
   ================================================================ */
function decodePolyline6(str) {
  // Valhalla uses precision-6 encoded polylines
  const coords = [];
  let idx = 0, lat = 0, lng = 0;
  while (idx < str.length) {
    let b, shift = 0, result = 0;
    do { b = str.charCodeAt(idx++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
    lat += (result & 1) ? ~(result >> 1) : (result >> 1);
    shift = 0; result = 0;
    do { b = str.charCodeAt(idx++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
    lng += (result & 1) ? ~(result >> 1) : (result >> 1);
    coords.push([lat / 1e6, lng / 1e6]);
  }
  return coords;
}

async function fetchRoute(lat, lng, targetM, costing, bOffset) {
  const intermediates = buildWaypoints(lat, lng, targetM, 4, bOffset);

  // Build location list: break → 4×through → break (back to start)
  const locations = [
    { lat, lon: lng, type: 'break' },
    ...intermediates.map(([la, lo]) => ({ lat: la, lon: lo, type: 'through' })),
    { lat, lon: lng, type: 'break' }
  ];

  const body = { locations, costing, directions_type: 'none', units: 'km' };

  const res = await fetch(VALHALLA, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });

  if (!res.ok) {
    const text = await res.text().catch(() => '');
    throw new Error(`Routing service returned ${res.status}${text ? ': ' + text : ''}`);
  }

  const data = await res.json();
  if (!data.trip) throw new Error('No route returned by routing service.');

  const coords   = decodePolyline6(data.trip.legs[0].shape);
  const distM    = data.trip.summary.length * 1000; // Valhalla returns km
  return { coords, distM };
}

/* ================================================================
   Generate
   ================================================================ */
async function generateRoute() {
  if (!startPoint) {
    showError('Set a start point first — click anywhere on the map or use your location.');
    return;
  }

  hideError();
  setLoading(true);

  try {
    const targetKm = parseFloat(document.getElementById('dist-slider').value);
    const costing  = COSTING[activity];
    const col      = COLOR[activity];

    const { coords, distM } = await fetchRoute(
      startPoint.lat, startPoint.lng, targetKm * 1000, costing, bearingBase
    );

    if (routeLayer) map.removeLayer(routeLayer);
    routeLayer = L.polyline(coords, {
      color: col, weight: 5, opacity: 0.9, lineCap: 'round', lineJoin: 'round'
    }).addTo(map);

    // Ensure start marker is on top
    if (startMarker) { startMarker.remove(); startMarker.addTo(map); }

    map.fitBounds(routeLayer.getBounds(), { padding: [40, 40] });
    showStats(distM, activity);

  } catch (err) {
    showError('Could not generate route: ' + err.message);
  } finally {
    setLoading(false);
  }
}

/* ================================================================
   Event wiring
   ================================================================ */

// Activity tabs
document.querySelectorAll('.activity-btn').forEach(btn => {
  btn.addEventListener('click', function () {
    document.querySelectorAll('.activity-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    activity = this.dataset.activity;
  });
});

// Distance slider
document.getElementById('dist-slider').addEventListener('input', function () {
  const v = parseFloat(this.value);
  document.getElementById('dist-val').textContent = v % 1 === 0 ? v : v.toFixed(1);
});

// GPS button
document.getElementById('btn-location').addEventListener('click', function () {
  if (!navigator.geolocation) { showError('Geolocation is not supported by your browser.'); return; }
  this.disabled = true;
  this.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Locating…';
  const btn = this;
  navigator.geolocation.getCurrentPosition(
    pos => {
      placeStart(pos.coords.latitude, pos.coords.longitude);
      map.setView([pos.coords.latitude, pos.coords.longitude], 15);
      btn.disabled = false;
      btn.innerHTML = '<i class="fa fa-crosshairs"></i> Use My Location';
    },
    err => {
      showError('Location unavailable: ' + err.message);
      btn.disabled = false;
      btn.innerHTML = '<i class="fa fa-crosshairs"></i> Use My Location';
    }
  );
});

// Generate
document.getElementById('btn-generate').addEventListener('click', generateRoute);

// Reshuffle bearing (try a different loop direction)
document.getElementById('btn-reshuffle').addEventListener('click', () => {
  bearingBase = (bearingBase + 45 + Math.random() * 90) % 360;
  generateRoute();
});
</script>
</body>
</html>
